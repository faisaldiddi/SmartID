<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=/SmartID/" />
    <title>Redirecting to SmartID...</title>
    <script>
      // Single Page Apps for GitHub Pages redirection script
      // Redirects 404 paths to index.html preserving search and hash
      var path = window.location.pathname;
      var hash = window.location.hash;
      var search = window.location.search;
      var target = '/SmartID/' + (hash ? hash : '');
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/SmartID/">SmartID</a>...</p>
  </body>
</html>
